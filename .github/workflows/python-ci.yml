name: CI

on:
  push:
    branches: [ main, feature/display ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest -q --cov=src/calculator --cov-report=xml --cov-report=term-missing

      - name: Run pylint
        run: |
          pip install pylint
          pylint -j 0 src/calculator
