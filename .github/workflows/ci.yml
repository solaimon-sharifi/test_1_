name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Playwright browsers
        run: |
          npx playwright install --with-deps || playwright install --with-deps || true

      - name: Run unit & integration tests
        env:
          PYTHONPATH: src
        run: |
          pytest -q

      - name: Start uvicorn for E2E tests
        env:
          PYTHONPATH: src
        run: |
          nohup uvicorn calculator.main:app --host 127.0.0.1 --port 8001 &
          sleep 1

      - name: Run E2E tests (Playwright)
        env:
          PYTHONPATH: src
        run: |
          pytest -q tests/e2e -k test_homepage_add
